<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrator Login — E-Voting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-box">

    <div class="login-logo"><i class="bi bi-shield-lock-fill"></i></div>

    <h1>Administrator</h1>
    <p>Enter your password to access this panel.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for _, msg in messages %}
      <div class="login-error"><i class="bi bi-exclamation-circle me-2"></i>{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="form-group">
        <label class="label">Password</label>
        <div style="position:relative">
          <input type="password" name="password" id="pwd"
                 class="input" placeholder="Enter password" autofocus required>
          <button type="button" id="togglePwd"
                  style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                         background:none;border:none;color:hsl(240,4%,45%);cursor:pointer;padding:4px">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-admin btn-full btn-lg">
        <i class="bi bi-box-arrow-in-right"></i> Sign in
      </button>
    </form>

    <a href="{{ url_for('main.index') }}" class="login-back">
      <i class="bi bi-arrow-left" style="font-size:.75rem"></i> Back to home
    </a>
  </div>
</div>
<script>
document.getElementById('togglePwd').addEventListener('click', function() {
  const p = document.getElementById('pwd');
  const i = document.getElementById('eyeIcon');
  if (p.type === 'password') { p.type = 'text';     i.className = 'bi bi-eye-slash'; }
  else                       { p.type = 'password'; i.className = 'bi bi-eye'; }
});
</script>
</body>
</html>
